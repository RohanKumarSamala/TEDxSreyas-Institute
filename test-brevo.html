<!DOCTYPE html>
<html>
<body>
  <h1>Brevo Test</h1>
  <script>
    async function testBrevo() {
      try {
        console.log("Sending...");
        const response = await fetch('https://api.brevo.com/v3/smtp/email', {
          method: 'POST',
          headers: {
            'accept': 'application/json',
            'api-key': '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',
            'content-type': 'application/json'
          },
          body: JSON.stringify({
            sender: { name: "TEDxSreyas Institute", email: "tedxsreyasinstitute@gmail.com" },
            to: [ { email: "tedxsreyasinstitute@gmail.com", name: "Test" } ],
            subject: "CORS Test",
            htmlContent: "<html><body>Test</body></html>"
          })
        });
        const text = await response.text();
        console.log("Response:", response.status, text);
        document.body.innerHTML += "<p>Status: " + response.status + "</p><p>" + text + "</p>";
      } catch (err) {
        console.error("Fetch Error:", err);
        document.body.innerHTML += "<p style='color:red;'>Error: " + err.message + "</p>";
      }
    }
    testBrevo();
  </script>
</body>
</html>
